name: Export Binance 15M OHLCV CSV

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-ohlcv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Binance Spot 15M candles
        run: python export_ohlcv.py

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: binance-spot-15m-oct23-to-now
          path: binance_spot_15m_oct23_to_now_2026.csv
          if-no-files-found: error
          retention-days: 7
