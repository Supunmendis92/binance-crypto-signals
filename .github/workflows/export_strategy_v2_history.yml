name: Export Strategy V2 Historical Spot Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and validate historical candles
        run: python export_strategy_v2_history.py
      - name: Upload CSV and summary
        uses: actions/upload-artifact@v4
        with:
          name: strategy-v2-binance-history-2025-11-to-2026-11
          path: |
            strategy_v2_binance_spot_15m_2025-11-01_to_2026-11-09.csv
            strategy_v2_export_summary.json
          if-no-files-found: error
          retention-days: 7
