name: Binance Crypto Signals

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binance-signal-bot
  cancel-in-progress: false

jobs:

  signal:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Binance signal scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python signal_bot.py

      - name: Run signal monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python signal_monitor.py

      - name: Save signal state
        run: |

          if [ ! -f signal_state.json ]; then
            echo "No signal_state.json file found."
            exit 0
          fi

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add signal_state.json

          if git diff --cached --quiet; then
            echo "No signal state changes."
          else
            git commit -m "Update signal state"
            git push
          fi
